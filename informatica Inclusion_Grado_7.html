<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Misión Código Inclusión 7°</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:#f2f7ff;color:#17213b}main{max-width:520px;margin:auto;min-height:100dvh;padding:12px}.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 7px 25px #0001}.center{text-align:center}.hero{font-size:56px}h1{font-size:28px;margin:6px}.lead{font-size:18px;line-height:1.45}input{width:100%;font-size:18px;padding:16px;border:2px solid #ccd5e5;border-radius:16px;margin:10px 0 14px}.main{width:100%;border:0;border-radius:17px;padding:17px;font-size:19px;font-weight:bold;background:#315efb;color:#fff}.hidden{display:none}.top{display:flex;justify-content:space-between;font-weight:bold}.progress{height:12px;background:#e5e9f1;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#315efb;transition:.3s}.qicon{text-align:center;font-size:48px}.q{text-align:center;font-size:22px;font-weight:bold;line-height:1.3;margin:8px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{min-height:130px;border:3px solid #dce3ee;background:#fafcff;border-radius:19px;padding:9px;font-size:15px;font-weight:bold;line-height:1.25}.pic{display:block;font-size:36px;margin-bottom:7px}.opt.good{border-color:#198754;background:#eaf8f0}.opt.bad{border-color:#c63b3b;background:#fff0f0}.fb{font-size:17px;line-height:1.4;padding:13px;border-radius:14px;margin:13px 0}.fb.good{background:#eaf8f0}.fb.bad{background:#fff0f0}.small{font-size:.85rem;color:#69758b}.footer{text-align:center;color:#70798b;font-size:12px;padding:14px}@media(max-width:365px){.opt{min-height:118px;font-size:14px}.pic{font-size:32px}.q{font-size:20px}}</style></head><body><main>
<section id="start" class="card center"><div class="hero">🤖🧩⭐</div><h1>Misión Código 7.º</h1><h2>Repaso adaptado</h2><p class="lead">Mira 👀 · Lee o escucha 👂 · Elige 👆<br><b>¡Aprende jugando!</b></p><input id="name" placeholder="Tu nombre"><button class="main" onclick="start()">JUGAR ▶️</button><p class="small">5 retos por partida · Puedes repetir muchas veces</p></section>
<section id="game" class="card hidden"><div class="top"><span id="who"></span><span>⭐ <b id="score">0</b></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="qicon" class="qicon"></div><div id="q" class="q"></div><div id="opts" class="grid"></div><div id="fb" class="fb hidden"></div><button id="next" class="main hidden" onclick="next()">SIGUIENTE ➜</button></section>
<section id="end" class="card center hidden"><div id="emoji" class="hero">🌟</div><h1 id="title"></h1><p id="msg" class="lead"></p><h2>⭐ <span id="final"></span> puntos</h2><button class="main" onclick="start()">JUGAR OTRA VEZ 🔄</button></section><div class="footer">Tecnología e Informática · Grado 7.º · Inclusión</div></main>
<script>const B=[{"q": "¿Cuál muestra un proyecto tecnológico?", "icon": "🛠️", "opts": [{"pic": "👧🏽👦🏽💡", "txt": "Hacer un plan para solucionar un problema con tecnología"}, {"pic": "🎮", "txt": "Usar una tableta solo para jugar"}, {"pic": "📺", "txt": "Ver televisión"}, {"pic": "📦📱", "txt": "Guardar aparatos"}], "a": 0, "exp": "Un proyecto tecnológico busca solucionar un problema o necesidad usando tecnología."}, {"q": "¿Qué es un algoritmo?", "icon": "👣", "opts": [{"pic": "📋✏️", "txt": "Una lista de pasos para hacer algo"}, {"pic": "🔒", "txt": "Un candado"}, {"pic": "🎨", "txt": "Un dibujo"}, {"pic": "🌎", "txt": "El planeta Tierra"}], "a": 0, "exp": "Un algoritmo es una lista de pasos organizados y ordenados."}, {"q": "¿Para qué sirve una variable?", "icon": "📦", "opts": [{"pic": "📦5️⃣", "txt": "Guardar un dato que puede cambiar"}, {"pic": "🔁", "txt": "Repetir siempre"}, {"pic": "🛑", "txt": "Detener todo"}, {"pic": "📝", "txt": "Escribir un texto"}], "a": 0, "exp": "Una variable guarda un dato que puede cambiar, como un contador."}, {"q": "¿Cuál bloque permite que el programa tome una decisión?", "icon": "🤔", "opts": [{"pic": "🟩 SI ➜ ENTONCES", "txt": "Si… entonces"}, {"pic": "🔁", "txt": "Repetir"}, {"pic": "💬", "txt": "Decir Hola"}, {"pic": "🚩", "txt": "Bandera verde"}], "a": 0, "exp": "«Si… entonces» permite tomar una decisión cuando se cumple una condición."}, {"q": "¿Cómo hacemos que un personaje diga 5 veces el mismo mensaje usando menos bloques?", "icon": "💬5️⃣", "opts": [{"pic": "🔁 5 × 💬", "txt": "Usar repetir 5"}, {"pic": "💬💬💬💬💬", "txt": "Poner el mensaje cinco veces"}, {"pic": "❌", "txt": "No se puede repetir"}, {"pic": "🛑", "txt": "Detener el programa"}], "a": 0, "exp": "El bucle «repetir 5» repite la acción usando menos bloques."}, {"q": "¿Cuál es un buen proyecto para cuidar la escuela?", "icon": "🏫💚", "opts": [{"pic": "💡♻️", "txt": "Crear una solución para separar residuos"}, {"pic": "🎮", "txt": "Jugar todo el día"}, {"pic": "📺", "txt": "Ver televisión"}, {"pic": "📦", "txt": "Guardar equipos sin usarlos"}], "a": 0, "exp": "Un proyecto tecnológico responde a un problema o necesidad real."}, {"q": "Para preparar una receta, ¿qué se parece más a un algoritmo?", "icon": "🥣", "opts": [{"pic": "1️⃣2️⃣3️⃣", "txt": "Seguir los pasos en orden"}, {"pic": "🎨", "txt": "Pintar sin instrucciones"}, {"pic": "🔒", "txt": "Cerrar un candado"}, {"pic": "🌍", "txt": "Mirar un mapa"}], "a": 0, "exp": "Un algoritmo indica pasos que deben seguirse de manera organizada."}, {"q": "El marcador empieza en 0 y luego cambia a 1. El marcador es…", "icon": "0️⃣➡️1️⃣", "opts": [{"pic": "📦", "txt": "Una variable"}, {"pic": "🔁", "txt": "Un bucle"}, {"pic": "🟩", "txt": "Un condicional"}, {"pic": "📝", "txt": "Un texto"}], "a": 0, "exp": "Es una variable porque guarda un valor que puede cambiar."}, {"q": "SI llueve, ENTONCES mostrar «Usa paraguas». ¿Qué usa el programa?", "icon": "🌧️☂️", "opts": [{"pic": "🤔", "txt": "Una decisión o condicional"}, {"pic": "📦", "txt": "Solo una variable"}, {"pic": "📝", "txt": "Un documento"}, {"pic": "🎨", "txt": "Un dibujo"}], "a": 0, "exp": "El programa comprueba una condición antes de realizar una acción."}, {"q": "¿Cuál opción repite una acción varias veces?", "icon": "🔁", "opts": [{"pic": "🔁", "txt": "Bucle repetir"}, {"pic": "📦", "txt": "Variable"}, {"pic": "🟩 SI", "txt": "Condicional"}, {"pic": "✏️", "txt": "Texto"}], "a": 0, "exp": "Un bucle sirve para repetir una misma acción varias veces."}, {"q": "¿Qué puede guardar una variable?", "icon": "📦❓", "opts": [{"pic": "⭐ 3 ➜ 4", "txt": "Puntos que cambian"}, {"pic": "🌳", "txt": "Un árbol real"}, {"pic": "☁️", "txt": "Una nube"}, {"pic": "🪨", "txt": "Una roca"}], "a": 0, "exp": "Una variable puede guardar datos que cambian durante el programa."}, {"q": "¿Cuál muestra una decisión?", "icon": "🤔", "opts": [{"pic": "🟩 SI hay riesgo ➜ 🚨 alerta", "txt": "Si hay riesgo, mostrar alerta"}, {"pic": "🔁💬", "txt": "Repetir un mensaje"}, {"pic": "🚩", "txt": "Iniciar"}, {"pic": "📝", "txt": "Escribir"}], "a": 0, "exp": "Una decisión usa una condición: si ocurre algo, entonces realiza una acción."}, {"q": "¿Qué opción usa menos bloques?", "icon": "🧩", "opts": [{"pic": "🔁 5", "txt": "Repetir 5"}, {"pic": "💬💬💬💬💬", "txt": "Cinco bloques iguales"}, {"pic": "❌", "txt": "No hacer nada"}, {"pic": "🛑", "txt": "Detener"}], "a": 0, "exp": "Un bucle permite repetir con menos bloques."}, {"q": "¿Cuál lista está organizada como un algoritmo?", "icon": "📋", "opts": [{"pic": "1️⃣ Iniciar  2️⃣ Mostrar  3️⃣ Finalizar", "txt": "Pasos en orden"}, {"pic": "3️⃣1️⃣2️⃣", "txt": "Pasos desordenados"}, {"pic": "🎨🌎🔒", "txt": "Imágenes sin pasos"}, {"pic": "❓", "txt": "Sin instrucciones"}], "a": 0, "exp": "Un algoritmo tiene pasos organizados en un orden."}, {"q": "¿Qué ayuda a resolver un problema de la escuela?", "icon": "🏫", "opts": [{"pic": "💡🛠️", "txt": "Pensar y crear una solución tecnológica"}, {"pic": "📺", "txt": "Ver televisión"}, {"pic": "🎮", "txt": "Jugar"}, {"pic": "📦", "txt": "Guardar aparatos"}], "a": 0, "exp": "La tecnología puede utilizarse para resolver problemas y mejorar nuestro entorno."}];let qs=[],i=0,s=0,c=0,n="",lock=false;const $=x=>document.getElementById(x);function mix(a){return [...a].sort(()=>Math.random()-.5)}
function start(){n=$("name").value.trim()||n||"Estudiante";qs=mix(B).slice(0,5);i=0;s=0;c=0;$("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");render()}
function render(){lock=false;let x=qs[i];$("who").textContent="👤 "+n;$("score").textContent=s;$("bar").style.width=(i/5*100)+"%";$("qicon").textContent=x.icon;$("q").textContent=x.q;$("opts").innerHTML="";$("fb").className="fb hidden";$("next").classList.add("hidden");let ord=mix(x.opts.map((v,k)=>({v,k})));ord.forEach(z=>{let b=document.createElement("button");b.className="opt";b.dataset.k=z.k;b.innerHTML='<span class="pic">'+z.v.pic+'</span>'+z.v.txt;b.onclick=()=>ans(z.k,b);$("opts").appendChild(b)})}
function ans(k,b){if(lock)return;lock=true;let x=qs[i],bs=[...document.querySelectorAll(".opt")];bs.forEach(z=>{z.disabled=true;if(+z.dataset.k===x.a)z.classList.add("good")});if(k===x.a){s+=100;c++;$("fb").className="fb good";$("fb").innerHTML="<b>🎉 ¡MUY BIEN!</b><br>"+x.exp}else{b.classList.add("bad");$("fb").className="fb bad";$("fb").innerHTML="<b>💡 MIRA LA RESPUESTA VERDE.</b><br>"+x.exp}$("score").textContent=s;$("next").classList.remove("hidden")}
function next(){i++;i<5?render():finish()}function finish(){$("game").classList.add("hidden");$("end").classList.remove("hidden");$("final").textContent=s;if(c>=4){$("emoji").textContent="🏆";$("title").textContent="¡Excelente, "+n+"!";$("msg").textContent="Lo hiciste muy bien. Juega otra vez para seguir practicando."}else{$("emoji").textContent="🌟";$("title").textContent="¡Buen trabajo, "+n+"!";$("msg").textContent="Cada intento te ayuda a aprender. Mira las imágenes y vuelve a jugar."}}</script></body></html>
