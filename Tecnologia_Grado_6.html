<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Tecnología 6°</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#657089;--primary:#315efb;--good:#178447;--bad:#c73b3b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:560px;margin:auto;min-height:100dvh;padding:18px 14px 30px}.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 8px 30px #1b2a4a18}
h1{font-size:1.75rem;margin:.2rem 0 .6rem}h2{font-size:1.28rem;line-height:1.35}.lead{color:var(--muted);line-height:1.5}
input{width:100%;font-size:16px;padding:15px;border:1px solid #ccd3df;border-radius:14px;margin:10px 0}
button{font:inherit}.main{width:100%;padding:15px;border:0;border-radius:14px;background:var(--primary);color:white;font-weight:800;font-size:1rem}
.top{display:flex;gap:8px;justify-content:space-between;font-size:.9rem;font-weight:700;margin-bottom:10px}.progress{height:10px;background:#e4e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--primary);width:0;transition:.3s}
.option{display:block;width:100%;text-align:left;background:#f7f9fc;border:2px solid #e1e6ef;padding:14px;margin:10px 0;border-radius:15px;font-weight:650;line-height:1.3}
.option:active{transform:scale(.99)}.option.good{border-color:var(--good);background:#eaf8f0}.option.bad{border-color:var(--bad);background:#fff0f0}
.feedback{padding:13px;border-radius:14px;margin-top:13px;line-height:1.4}.feedback.good{background:#eaf8f0}.feedback.bad{background:#fff0f0}
.hidden{display:none}.emoji{font-size:3rem}.center{text-align:center}.small{font-size:.86rem;color:var(--muted)}
.badges{display:flex;justify-content:center;gap:14px;margin:14px 0;font-weight:800}.footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:16px}
@media(max-width:380px){.app{padding:10px}.card{padding:16px;border-radius:18px}h1{font-size:1.5rem}.option{padding:12px}}
</style></head>
<body><main class="app">
<section id="start" class="card center">
<div class="emoji">🤖📱</div><h1>Misión Tecnología 6°</h1>
<p class="lead">Entrena para tu evaluación final. Cada partida tiene 10 retos al azar. Lee, piensa y gana puntos.</p>
<input id="name" maxlength="35" placeholder="Escribe tu nombre">
<button class="main" onclick="startGame()">COMENZAR MISIÓN 🚀</button>
<p class="small">Puedes jugar varias veces: las preguntas cambian.</p>
</section>
<section id="game" class="card hidden">
<div class="top"><span id="who"></span><span>❤️ <b id="lives">3</b> &nbsp; ⭐ <b id="score">0</b></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<p class="small">Reto <span id="num"></span> de 10</p><h2 id="question"></h2><div id="options"></div>
<div id="feedback" class="feedback hidden"></div><button id="next" class="main hidden" onclick="nextQ()">SIGUIENTE →</button>
</section>
<section id="end" class="card center hidden">
<div id="endEmoji" class="emoji"></div><h1 id="endTitle"></h1><p id="endText" class="lead"></p>
<div class="badges"><span>⭐ <span id="finalScore"></span></span><span>✅ <span id="correct"></span>/10</span></div>
<button class="main" onclick="startGame()">JUGAR OTRA VEZ 🔄</button><p class="small">Cada nueva partida selecciona otros retos.</p>
</section>
<div class="footer">Repaso de Tecnología e Informática · Grado 6.º</div>
</main>
<script>
const BANK = [{"q": "En la huerta escolar, un tanque envía agua por mangueras hasta varias plantas. ¿Por qué este conjunto puede considerarse un sistema tecnológico?", "opts": ["Porque todas sus partes trabajan relacionadas para cumplir una función.", "Porque solamente el tanque es importante.", "Porque todo sistema debe tener un computador.", "Porque funciona sin intervención de ninguna parte."], "a": 0, "exp": "Un sistema tecnológico está formado por partes relacionadas que trabajan juntas para cumplir una función."}, {"q": "En un programa, Ana presiona una tecla y el personaje comienza a caminar. ¿Qué representa la acción de presionar la tecla?", "opts": ["Una salida", "Una entrada", "Una falla", "El resultado final"], "a": 1, "exp": "La entrada es la información o acción que el sistema recibe para iniciar una respuesta."}, {"q": "Un sensor permite cerrar el riego cuando las plantas ya recibieron suficiente agua. ¿Qué beneficio muestra este uso de la tecnología?", "opts": ["Aumentar el desperdicio de agua", "Evitar el cuidado de los recursos", "Usar los recursos de manera más eficiente", "Reemplazar todas las tareas humanas"], "a": 2, "exp": "La tecnología puede ayudar a controlar mejor el uso de recursos y reducir el desperdicio."}, {"q": "En la escuela ya existe un sistema de riego, pero los estudiantes lo modifican para que use menos agua. Esto es un ejemplo de…", "opts": ["Innovación tecnológica", "Una falla del sistema", "Comunicación digital", "Una tabla de datos"], "a": 0, "exp": "Innovar también puede significar mejorar una solución existente para resolver mejor una necesidad."}, {"q": "Un compañero publica por error un dato incorrecto en el grupo del curso. ¿Cuál respuesta demuestra comunicación digital responsable?", "opts": ["«Qué vergüenza, siempre te equivocas».", "«Voy a compartirlo para que todos lo vean».", "«Creo que ese dato puede estar equivocado. Revisémoslo juntos».", "«No vuelvas a escribir en el grupo»."], "a": 2, "exp": "La comunicación digital responsable exige respeto, buen trato y disposición para solucionar los problemas."}, {"q": "Necesitas escribir los nombres de varios componentes de un sistema y organizar su función en una tabla. ¿Qué herramienta es la más apropiada?", "opts": ["Microsoft Word", "Scratch", "Una calculadora", "Un reproductor de música"], "a": 0, "exp": "Word permite escribir textos y organizar información mediante tablas."}, {"q": "En Scratch, una variable llamada «puntos» empieza en 0 y aumenta durante el juego. ¿Para qué sirve esa variable?", "opts": ["Para guardar información que puede cambiar", "Para cambiar únicamente el color del personaje", "Para reemplazar todos los bloques", "Para crear diapositivas"], "a": 0, "exp": "Una variable almacena información cuyo valor puede cambiar mientras funciona el programa."}, {"q": "Tu curso registró cuántos computadores funcionan en cada salón. ¿Cómo podrían comparar los datos rápidamente?", "opts": ["Repitiendo los números muchas veces", "Con una tabla y un gráfico", "Eliminando los números diferentes", "Dibujando sin mostrar los datos"], "a": 1, "exp": "Las tablas organizan los datos y los gráficos facilitan su comparación visual."}, {"q": "En Scratch: SI el personaje toca un objeto, ENTONCES suma un punto. ¿Qué hace el bloque «si–entonces»?", "opts": ["Toma una decisión cuando se cumple una condición", "Guarda todos los archivos del computador", "Repite siempre sin comprobar nada", "Crea automáticamente una presentación"], "a": 0, "exp": "Una condición permite decidir qué acción realizar cuando ocurre una situación determinada."}, {"q": "Un grupo quiere solucionar el desperdicio de agua en la escuela. ¿Cuál proceso es el más adecuado?", "opts": ["Copiar una solución de Internet y entregarla como propia", "Hacer diapositivas sin estudiar el problema", "Identificar el problema, proponer, probar, mejorar y comunicar la solución", "Construir algo sin comprobar si funciona"], "a": 2, "exp": "Un proyecto tecnológico parte de un problema, propone una solución, la prueba, la mejora y comunica sus resultados."}, {"q": "Un sistema recibe la orden de encender una lámpara y luego la lámpara se ilumina. ¿Cuál es la salida del sistema?", "opts": ["La orden de encender", "La lámpara iluminada", "El botón antes de presionarlo", "El cable sin conectar"], "a": 1, "exp": "La salida es la respuesta que produce el sistema después de recibir y procesar una entrada."}, {"q": "Los estudiantes cambian la forma de distribuir las mangueras para que todas las plantas reciban agua. ¿Qué están haciendo?", "opts": ["Mejorando una solución tecnológica", "Eliminando el sistema", "Creando una comunicación irrespetuosa", "Guardando una variable"], "a": 0, "exp": "Mejorar una tecnología existente para resolver mejor una necesidad es una forma de innovación."}, {"q": "En Scratch, el valor de «vidas» pasa de 3 a 2 cuando el personaje toca un obstáculo. «vidas» es…", "opts": ["Un gráfico", "Una variable", "Una diapositiva", "Una salida de Word"], "a": 1, "exp": "Es una variable porque almacena un dato que puede cambiar durante la ejecución del programa."}, {"q": "Si quieres mostrar visualmente qué salón tiene más computadores disponibles, ¿qué recurso ayuda más?", "opts": ["Un gráfico", "Un párrafo repetido", "Un reproductor de música", "Un personaje de Scratch sin datos"], "a": 0, "exp": "Un gráfico facilita comparar visualmente cantidades registradas."}, {"q": "Un estudiante recibe un mensaje con una opinión diferente a la suya. ¿Qué debería hacer?", "opts": ["Responder con insultos", "Compartir el mensaje para burlarse", "Responder respetuosamente aunque no esté de acuerdo", "Excluir al compañero del grupo"], "a": 2, "exp": "La comunicación digital responsable implica respetar a los demás, incluso cuando existen diferencias."}, {"q": "¿Cuál situación muestra mejor que varias partes forman un sistema?", "opts": ["Un tanque, mangueras y plantas conectados en un sistema de riego", "Un cuaderno guardado en un cajón", "Un lápiz sin utilizar", "Una imagen decorativa"], "a": 0, "exp": "En un sistema, diferentes elementos se relacionan para cumplir una función."}, {"q": "En Scratch: SI la puntuación llega a 10, ENTONCES aparece «¡Ganaste!». ¿Qué debe ocurrir para mostrar el mensaje?", "opts": ["Que se cumpla la condición de llegar a 10", "Que se cierre Word", "Que desaparezcan todas las variables", "Que se cree un gráfico"], "a": 0, "exp": "El programa realiza la acción cuando se cumple la condición indicada."}, {"q": "Una familia controla mejor el tiempo de riego para evitar desperdiciar agua. ¿Qué relación entre tecnología y ambiente se observa?", "opts": ["La tecnología puede contribuir al uso responsable de recursos", "Toda tecnología destruye el ambiente", "La tecnología solo sirve con computadores", "Cuidar el agua deja de ser responsabilidad de las personas"], "a": 0, "exp": "Una solución tecnológica bien utilizada puede favorecer un uso más eficiente de los recursos."}, {"q": "Antes de construir una solución tecnológica para la escuela, ¿qué conviene hacer primero?", "opts": ["Identificar el problema o necesidad", "Preparar únicamente las diapositivas", "Copiar la solución de otra persona", "Decidir que no es necesario probarla"], "a": 0, "exp": "El proyecto tecnológico comienza identificando claramente el problema o necesidad que se quiere resolver."}, {"q": "Después de probar una solución, los estudiantes descubren que todavía desperdicia agua. ¿Qué deberían hacer?", "opts": ["Presentarla sin cambios", "Mejorarla y volver a comprobar su funcionamiento", "Ocultar el problema", "Eliminar todos los datos obtenidos"], "a": 1, "exp": "Probar y mejorar la propuesta forma parte del desarrollo de una solución tecnológica."}, {"q": "Un personaje recibe la orden de avanzar 10 pasos y luego se mueve. ¿Cuál opción relaciona correctamente entrada y respuesta?", "opts": ["Entrada: movimiento; respuesta: tecla", "Entrada: orden; respuesta: movimiento", "Entrada: gráfico; respuesta: tabla", "Entrada: falla; respuesta: variable"], "a": 1, "exp": "La orden es la entrada que recibe el sistema y el movimiento es la respuesta producida."}, {"q": "¿Cuál dato sería apropiado guardar en una variable de Scratch?", "opts": ["La cantidad de puntos de un jugador", "El nombre del programa Word instalado", "Una mesa del salón", "Una hoja impresa que nunca cambia"], "a": 0, "exp": "Los puntos pueden cambiar durante el programa, por eso son adecuados para almacenarlos en una variable."}, {"q": "Los estudiantes tienen una lista de cantidades y quieren que otras personas comprendan fácilmente los resultados. ¿Qué deberían hacer?", "opts": ["Organizar los datos y representarlos visualmente", "Borrar los valores más altos", "Escribirlos sin orden", "Ocultar los resultados"], "a": 0, "exp": "Organizar los datos en tablas y representarlos mediante gráficos facilita su interpretación."}, {"q": "¿Cuál comportamiento NO corresponde a una comunicación digital responsable?", "opts": ["Corregir con respeto", "Escuchar otras opiniones", "Burlarse públicamente de un error", "Proponer revisar juntos la información"], "a": 2, "exp": "Las burlas y agresiones no corresponden a una comunicación digital responsable."}, {"q": "Al finalizar un proyecto tecnológico, el grupo explica qué problema encontró, qué solución probó y qué resultados obtuvo. ¿Qué etapa está realizando?", "opts": ["Comunicar los resultados", "Ignorar el problema", "Copiar una propuesta", "Eliminar la solución"], "a": 0, "exp": "Comunicar los resultados es una parte importante del proceso de un proyecto tecnológico."}];
let qs=[],idx=0,score=0,lives=3,correct=0,locked=false,student="";
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){
 student=$("name").value.trim()||student||"Estudiante"; qs=shuffle(BANK).slice(0,10);idx=0;score=0;lives=3;correct=0;
 $("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");$("who").textContent="👤 "+student;render()
}
function render(){
 locked=false;$("score").textContent=score;$("lives").textContent=lives;$("num").textContent=idx+1;$("bar").style.width=(idx*10)+"%";
 $("feedback").className="feedback hidden";$("next").classList.add("hidden");let q=qs[idx];$("question").textContent=q.q;$("options").innerHTML="";
 q.opts.forEach((o,i)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+". "+o;b.onclick=()=>answer(i,b);$("options").appendChild(b)})
}
function answer(i,b){
 if(locked)return;locked=true;let q=qs[idx],buttons=[...document.querySelectorAll(".option")],ok=i===q.a;
 buttons.forEach(x=>x.disabled=true);buttons[q.a].classList.add("good");
 if(ok){score+=100;correct++;$("feedback").className="feedback good";$("feedback").innerHTML="<b>🎉 ¡Excelente! +100 puntos</b><br>"+q.exp}
 else{lives=Math.max(0,lives-1);b.classList.add("bad");$("feedback").className="feedback bad";$("feedback").innerHTML="<b>💡 Esta vez no.</b><br>"+q.exp}
 $("score").textContent=score;$("lives").textContent=lives;$("next").classList.remove("hidden")
}
function nextQ(){idx++;if(idx<10)render();else finish()}
function finish(){
 $("game").classList.add("hidden");$("end").classList.remove("hidden");$("bar").style.width="100%";$("finalScore").textContent=score;$("correct").textContent=correct;
 let title,text,em;
 if(correct>=9){em="🏆";title="¡Experto tecnológico!";text=student+", estás muy bien preparado. Sigue repasando para mantener ese nivel."}
 else if(correct>=7){em="🥈";title="¡Muy buen trabajo!";text=student+", vas por muy buen camino. Repasa las explicaciones y vuelve a jugar."}
 else if(correct>=5){em="💪";title="¡Sigue entrenando!";text=student+", ya tienes varias ideas claras. Otra partida te ayudará a fortalecerlas."}
 else{em="📚";title="¡A practicar un poco más!";text=student+", revisa cada explicación y vuelve a intentarlo. Puedes mejorar con cada partida."}
 $("endEmoji").textContent=em;$("endTitle").textContent=title;$("endText").textContent=text
}
</script></body></html>
