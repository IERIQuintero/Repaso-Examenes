<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Misión TecnoData Inclusión 8°</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:#f2f7ff;color:#17213b}main{max-width:520px;margin:auto;min-height:100dvh;padding:12px}.card{background:white;border-radius:24px;padding:18px;box-shadow:0 7px 25px #0001}.center{text-align:center}.hero{font-size:56px}h1{font-size:28px;margin:6px}.lead{font-size:18px;line-height:1.45}input{width:100%;font-size:18px;padding:16px;border:2px solid #ccd5e5;border-radius:16px;margin:10px 0 14px}.main{width:100%;border:0;border-radius:17px;padding:17px;font-size:19px;font-weight:bold;background:#315efb;color:#fff}.hidden{display:none}.top{display:flex;justify-content:space-between;font-weight:bold}.progress{height:12px;background:#e5e9f1;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#315efb;transition:.3s}.qicon{text-align:center;font-size:47px}.q{text-align:center;font-size:22px;font-weight:bold;line-height:1.3;margin:8px 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{min-height:130px;border:3px solid #dce3ee;background:#fafcff;border-radius:19px;padding:9px;font-size:15px;font-weight:bold;line-height:1.25}.pic{display:block;font-size:36px;margin-bottom:7px}.opt.good{border-color:#198754;background:#eaf8f0}.opt.bad{border-color:#c63b3b;background:#fff0f0}.fb{font-size:17px;line-height:1.4;padding:13px;border-radius:14px;margin:13px 0}.fb.good{background:#eaf8f0}.fb.bad{background:#fff0f0}.small{font-size:.85rem;color:#69758b}.footer{text-align:center;color:#70798b;font-size:12px;padding:14px}@media(max-width:365px){.opt{min-height:118px;font-size:14px}.pic{font-size:32px}.q{font-size:20px}}</style></head><body><main>
<section id="start" class="card center"><div class="hero">🤖📊🌱</div><h1>Misión TecnoData 8.º</h1><h2>Repaso adaptado</h2><p class="lead">Mira 👀 · Lee o escucha 👂 · Elige 👆<br><b>¡Aprende jugando!</b></p><input id="name" placeholder="Tu nombre"><button class="main" onclick="start()">JUGAR ▶️</button><p class="small">5 retos por partida · Puedes jugar muchas veces</p></section>
<section id="game" class="card hidden"><div class="top"><span id="who"></span><span>⭐ <b id="score">0</b></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="qicon" class="qicon"></div><div id="q" class="q"></div><div id="opts" class="grid"></div><div id="fb" class="fb hidden"></div><button id="next" class="main hidden" onclick="next()">SIGUIENTE ➜</button></section>
<section id="end" class="card center hidden"><div id="emoji" class="hero">🌟</div><h1 id="title"></h1><p id="msg" class="lead"></p><h2>⭐ <span id="final"></span> puntos</h2><button class="main" onclick="start()">JUGAR OTRA VEZ 🔄</button></section><div class="footer">Tecnología e Informática · Grado 8.º · Inclusión</div></main>
<script>const B=[{"q": "¿Qué es un algoritmo?", "icon": "👣📋", "opts": [{"pic": "1️⃣2️⃣3️⃣", "txt": "Pasos ordenados para hacer una tarea"}, {"pic": "📦", "txt": "Un archivo guardado"}, {"pic": "🔢", "txt": "Un número que cambia"}, {"pic": "🖼️", "txt": "Una imagen"}], "a": 0, "exp": "Un algoritmo es un conjunto de pasos ordenados para realizar una tarea."}, {"q": "Sofía escribe: 1. iniciar, 2. decir «Hola», 3. esperar, 4. finalizar. ¿Qué hizo?", "icon": "👋", "opts": [{"pic": "📋", "txt": "Un algoritmo"}, {"pic": "📊", "txt": "Un gráfico"}, {"pic": "📦", "txt": "Una variable"}, {"pic": "🖼️", "txt": "Una imagen"}], "a": 0, "exp": "Es un algoritmo porque organizó los pasos en orden."}, {"q": "El contador cambia: 0 ➜ 1 ➜ 2 ➜ 3. ¿Qué es?", "icon": "0️⃣➡️1️⃣➡️2️⃣", "opts": [{"pic": "📦🔢", "txt": "Una variable"}, {"pic": "🖼️", "txt": "Una imagen"}, {"pic": "🛑", "txt": "Un botón para apagar"}, {"pic": "📄", "txt": "Un documento"}], "a": 0, "exp": "Una variable puede guardar un dato que cambia."}, {"q": "¿Qué puede guardar una variable?", "icon": "📦❓", "opts": [{"pic": "⭐ 2 ➜ 3", "txt": "Un dato que cambia"}, {"pic": "🪨", "txt": "Una roca"}, {"pic": "☁️", "txt": "Una nube"}, {"pic": "🌳", "txt": "Un árbol"}], "a": 0, "exp": "Una variable almacena datos que pueden cambiar durante el programa."}, {"q": "SI consumo > 50 ➜ «Ahorrar agua». ¿Qué hace el programa?", "icon": "🤔💧", "opts": [{"pic": "🟩 SI ➜ 💬", "txt": "Toma una decisión"}, {"pic": "🎨", "txt": "Dibuja"}, {"pic": "📄", "txt": "Guarda un documento"}, {"pic": "🔁💬", "txt": "Repite siempre lo mismo"}], "a": 0, "exp": "«Si… entonces» permite tomar una decisión según un dato."}, {"q": "SI llueve ➜ usar paraguas. ¿Qué representa?", "icon": "🌧️☂️", "opts": [{"pic": "🤔", "txt": "Una decisión"}, {"pic": "📦", "txt": "Una variable"}, {"pic": "🖼️", "txt": "Una imagen sin acción"}, {"pic": "🔁", "txt": "Una repetición"}], "a": 0, "exp": "El programa comprueba una condición y decide qué hacer."}, {"q": "¿Cuál sirve para repetir una acción 5 veces con pocos bloques?", "icon": "5️⃣", "opts": [{"pic": "🔁 5", "txt": "REPETIR 5"}, {"pic": "💬💬💬💬💬", "txt": "Copiar cinco veces"}, {"pic": "🛑", "txt": "Detener"}, {"pic": "❌", "txt": "Borrar"}], "a": 0, "exp": "El bucle REPETIR permite hacer la misma acción varias veces usando menos instrucciones."}, {"q": "Laura quiere mover 10 pasos cinco veces. ¿Cuál opción es más sencilla?", "icon": "🚶", "opts": [{"pic": "🔁5️⃣ ➜ 10 pasos", "txt": "Usar REPETIR 5"}, {"pic": "📝📝📝📝📝", "txt": "Escribir cinco veces"}, {"pic": "📄", "txt": "Usar Word"}, {"pic": "🛑", "txt": "Detener"}], "a": 0, "exp": "REPETIR 5 evita escribir la misma instrucción muchas veces."}, {"q": "Los estudiantes registran residuos durante varios días. ¿Qué herramienta ayuda a organizar los datos?", "icon": "♻️📊", "opts": [{"pic": "📊", "txt": "Excel"}, {"pic": "🎮", "txt": "Un videojuego"}, {"pic": "🎵", "txt": "Reproductor de música"}, {"pic": "📺", "txt": "Televisor"}], "a": 0, "exp": "Excel ayuda a organizar datos y representarlos en gráficos."}, {"q": "¿Para qué sirve mirar un gráfico de residuos?", "icon": "📊👀", "opts": [{"pic": "🔎", "txt": "Comparar los resultados"}, {"pic": "🎮", "txt": "Jugar"}, {"pic": "🎨", "txt": "Decorar"}, {"pic": "❌", "txt": "Borrar los datos"}], "a": 0, "exp": "Los gráficos ayudan a comparar los datos y comprender mejor los resultados."}, {"q": "Zona A tiene 5 residuos. Zona B tiene 15. ¿Cuál necesita más atención?", "icon": "🗑️", "opts": [{"pic": "🅱️ 15", "txt": "Zona B"}, {"pic": "🅰️ 5", "txt": "Zona A"}, {"pic": "🤷", "txt": "Las dos tienen la misma cantidad"}, {"pic": "❌", "txt": "No se puede saber"}], "a": 0, "exp": "15 es mayor que 5, por eso la zona B registra más residuos."}, {"q": "¿Cuál ayuda a tomar una mejor decisión?", "icon": "🤔📊", "opts": [{"pic": "📊✅", "txt": "Observar y comparar los datos"}, {"pic": "🙈", "txt": "Ignorar los datos"}, {"pic": "🎲", "txt": "Elegir al azar"}, {"pic": "❌", "txt": "Borrar la información"}], "a": 0, "exp": "Los datos permiten comparar y tomar decisiones basadas en evidencias."}, {"q": "¿Cuál secuencia está en orden?", "icon": "🔢", "opts": [{"pic": "1️⃣ Inicio ➜ 2️⃣ acción ➜ 3️⃣ fin 3️⃣ ➜ 1️⃣ ➜ 2️⃣ 2️⃣ ➜ 3️⃣ ➜ 1️⃣", "txt": "❓ Sin orden"}], "a": 0, "exp": "Un algoritmo sigue un orden lógico de pasos."}, {"q": "¿Qué opción muestra una variable que cambia?", "icon": "📦", "opts": [{"pic": "0️⃣ ➜ 1️⃣ ➜ 2️⃣", "txt": "Contador"}, {"pic": "🌳", "txt": "Árbol"}, {"pic": "🪨", "txt": "Piedra"}, {"pic": "☁️", "txt": "Nube"}], "a": 0, "exp": "Un contador es un ejemplo sencillo de variable porque su valor cambia."}, {"q": "¿Qué ayuda a cuidar el ambiente en la escuela?", "icon": "🌎💚", "opts": [{"pic": "📊♻️", "txt": "Registrar residuos y decidir dónde actuar"}, {"pic": "🗑️🌳", "txt": "Botar residuos en cualquier lugar"}, {"pic": "🙈", "txt": "Ignorar el problema"}, {"pic": "❌📊", "txt": "Borrar los datos"}], "a": 0, "exp": "Registrar y analizar información puede ayudar a decidir dónde atender primero un problema ambiental."}];let qs=[],i=0,s=0,c=0,n="",lock=false;const $=x=>document.getElementById(x);function mix(a){return [...a].sort(()=>Math.random()-.5)}
function start(){n=$("name").value.trim()||n||"Estudiante";qs=mix(B).slice(0,5);i=0;s=0;c=0;$("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");render()}
function render(){lock=false;let x=qs[i];$("who").textContent="👤 "+n;$("score").textContent=s;$("bar").style.width=(i/5*100)+"%";$("qicon").textContent=x.icon;$("q").textContent=x.q;$("opts").innerHTML="";$("fb").className="fb hidden";$("next").classList.add("hidden");let ord=mix(x.opts.map((v,k)=>({v,k})));ord.forEach(z=>{let b=document.createElement("button");b.className="opt";b.dataset.k=z.k;b.innerHTML='<span class="pic">'+z.v.pic+'</span>'+z.v.txt;b.onclick=()=>ans(z.k,b);$("opts").appendChild(b)})}
function ans(k,b){if(lock)return;lock=true;let x=qs[i],bs=[...document.querySelectorAll(".opt")];bs.forEach(z=>{z.disabled=true;if(+z.dataset.k===x.a)z.classList.add("good")});if(k===x.a){s+=100;c++;$("fb").className="fb good";$("fb").innerHTML="<b>🎉 ¡MUY BIEN!</b><br>"+x.exp}else{b.classList.add("bad");$("fb").className="fb bad";$("fb").innerHTML="<b>💡 MIRA LA RESPUESTA VERDE.</b><br>"+x.exp}$("score").textContent=s;$("next").classList.remove("hidden")}
function next(){i++;i<5?render():finish()}function finish(){$("game").classList.add("hidden");$("end").classList.remove("hidden");$("final").textContent=s;if(c>=4){$("emoji").textContent="🏆";$("title").textContent="¡Excelente, "+n+"!";$("msg").textContent="Lo hiciste muy bien. Juega otra vez para seguir practicando."}else{$("emoji").textContent="🌟";$("title").textContent="¡Buen trabajo, "+n+"!";$("msg").textContent="Cada intento te ayuda a aprender. Mira las imágenes y vuelve a jugar."}}</script></body></html>
