<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Tecnología Inclusión 6°</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:#f3f7ff;color:#17213b}
main{max-width:520px;margin:auto;min-height:100dvh;padding:12px}.card{background:white;border-radius:24px;padding:18px;box-shadow:0 6px 25px #0001}
.center{text-align:center}.hero{font-size:56px;margin:5px}.title{font-size:28px;margin:5px 0}.lead{font-size:18px;line-height:1.45}
input{width:100%;font-size:18px;padding:16px;border:2px solid #ccd5e5;border-radius:16px;margin:8px 0 14px}
.main{width:100%;border:0;border-radius:17px;padding:17px;font-size:19px;font-weight:bold;background:#315efb;color:#fff}
.hidden{display:none}.top{display:flex;justify-content:space-between;font-size:16px;font-weight:bold;gap:8px}
.progress{height:12px;background:#e4e8f0;border-radius:20px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#315efb;transition:.3s}
.qicon{text-align:center;font-size:55px;margin:8px}.question{font-size:23px;line-height:1.3;text-align:center;margin:8px 0 15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.option{min-height:125px;border:3px solid #dce3ef;background:#fafcff;border-radius:20px;padding:10px;font-size:16px;font-weight:bold}
.option .pic{display:block;font-size:42px;margin-bottom:7px}.option.good{border-color:#198754;background:#eaf8f0}.option.bad{border-color:#c83b3b;background:#fff0f0}
.feedback{font-size:18px;line-height:1.4;padding:14px;border-radius:15px;margin:14px 0}.feedback.good{background:#eaf8f0}.feedback.bad{background:#fff0f0}
.small{color:#68738a}.result{font-size:20px}.footer{text-align:center;color:#6c7485;font-size:12px;padding:14px}
@media(max-width:360px){.grid{gap:7px}.option{min-height:112px;padding:7px}.option .pic{font-size:36px}.question{font-size:21px}}
</style></head><body><main>
<section id="start" class="card center"><div class="hero">🤖⭐</div><h1 class="title">Misión Tecnología</h1>
<h2>Repaso adaptado · 6.º</h2><p class="lead">Mira 👀 · Escucha 👂 · Elige 👆<br>Juega sin afán. ¡Tú puedes!</p>
<input id="name" placeholder="Tu nombre"><button class="main" onclick="start()">JUGAR ▶️</button>
<p class="small">5 retos por partida · Puedes jugar muchas veces</p></section>
<section id="game" class="card hidden"><div class="top"><span id="who"></span><span>⭐ <b id="score">0</b></span></div>
<div class="progress"><div id="bar" class="bar"></div></div><div class="qicon" id="qicon"></div><div class="question" id="q"></div>
<div class="grid" id="opts"></div><div id="fb" class="feedback hidden"></div><button id="next" class="main hidden" onclick="next()">SIGUIENTE ➜</button></section>
<section id="end" class="card center hidden"><div class="hero" id="endIcon">🌟</div><h1 id="endTitle"></h1><p class="result" id="endText"></p>
<h2>⭐ <span id="final"></span> puntos</h2><button class="main" onclick="start()">JUGAR OTRA VEZ 🔄</button></section>
<div class="footer">Tecnología e Informática · Grado 6.º · Repaso adaptado</div></main>
<script>
const B=[{"q": "¿Cuál ayuda a llevar agua hasta las plantas?", "icon": "🌱💧", "opts": [["🚿", "Manguera"], ["⚽", "Pelota"], ["🧸", "Oso de juguete"], ["🎒", "Mochila"]], "a": 0, "exp": "La manguera lleva agua hasta las plantas."}, {"q": "¿Cuál muestra una tecnología que cambió con el tiempo?", "icon": "⏳", "opts": [["⌨️ ➜ 📱", "Máquina de escribir a celular"], ["🌳 ➜ 🪨", "Árbol a piedra"], ["⚽ ➜ 🪀", "Balón a juguete"], ["☁️ ➜ ☀️", "Nube a sol"]], "a": 0, "exp": "Las herramientas para escribir y comunicarnos han cambiado con el tiempo."}, {"q": "¿Cuál es un objeto tecnológico que usamos para hacer una tarea?", "icon": "🛠️", "opts": [["🌳", "Árbol"], ["🥤", "Licuadora"], ["🪨", "Piedra"], ["☁️", "Nube"]], "a": 1, "exp": "La licuadora fue creada por las personas para realizar una tarea."}, {"q": "¿Cuál tecnología ayuda a cuidar el ambiente?", "icon": "🌎💚", "opts": [["☀️🏠", "Paneles solares"], ["🗑️💻", "Basura electrónica"], ["🚗💨", "Carro contaminando"], ["🔥🗑️", "Quemar residuos"]], "a": 0, "exp": "Los paneles solares aprovechan la energía del sol y ayudan a cuidar el ambiente."}, {"q": "Las plantas están secas porque les falta agua. ¿Qué puede ayudar?", "icon": "🥀☀️", "opts": [["🛢️💧🌱", "Tanque con agua para riego"], ["📺", "Televisor"], ["🎮", "Videojuego"], ["🚲", "Bicicleta"]], "a": 0, "exp": "Un sistema para guardar y llevar agua ayuda directamente a las plantas."}, {"q": "¿Qué objeto sirve para regar una planta?", "icon": "🌼", "opts": [["🚿", "Manguera"], ["🧸", "Juguete"], ["📚", "Libro"], ["⚽", "Balón"]], "a": 0, "exp": "La manguera permite llevar agua a la planta."}, {"q": "¿Cuál fue creado por las personas para preparar alimentos?", "icon": "🍓🥛", "opts": [["🥤", "Licuadora"], ["🌳", "Árbol"], ["☁️", "Nube"], ["🪨", "Piedra"]], "a": 0, "exp": "La licuadora es un objeto tecnológico creado para preparar alimentos."}, {"q": "¿Cuál opción aprovecha la energía del sol?", "icon": "☀️", "opts": [["🏠☀️", "Panel solar"], ["🚗💨", "Carro con humo"], ["🗑️", "Basura"], ["🎮", "Control de juego"]], "a": 0, "exp": "Los paneles solares aprovechan la energía del sol."}, {"q": "Si una planta necesita agua, ¿qué solución responde mejor al problema?", "icon": "🌱❓", "opts": [["💧", "Darle agua"], ["📺", "Encender un televisor"], ["⚽", "Jugar fútbol"], ["🎵", "Escuchar música"]], "a": 0, "exp": "La solución debe responder directamente a la necesidad: la planta necesita agua."}, {"q": "¿Cuál pareja muestra un cambio tecnológico?", "icon": "🔄", "opts": [["☎️ ➜ 📱", "Teléfono antiguo a celular"], ["🌳 ➜ 🌳", "Árbol a árbol"], ["🪨 ➜ 🪨", "Piedra a piedra"], ["☁️ ➜ ☁️", "Nube a nube"]], "a": 0, "exp": "El teléfono ha cambiado con el tiempo hasta llegar a dispositivos como el celular."}, {"q": "¿Cuál objeto fue diseñado para cumplir una función?", "icon": "🤔", "opts": [["🌀", "Ventilador"], ["🌤️", "Nube"], ["🌿", "Planta"], ["🪨", "Roca"]], "a": 0, "exp": "El ventilador es un objeto tecnológico creado por las personas para cumplir una función."}, {"q": "¿Qué acción ayuda a cuidar mejor nuestro entorno?", "icon": "🌎", "opts": [["☀️⚡", "Usar energía solar"], ["💻🗑️", "Botar aparatos en cualquier lugar"], ["🚗💨", "Producir más humo"], ["🚰💦", "Desperdiciar agua"]], "a": 0, "exp": "Usar fuentes de energía renovable, como la solar, puede ayudar a cuidar el entorno."}, {"q": "Hay plantas sin agua. ¿Cuál objeto NO ayuda a solucionar ese problema?", "icon": "🥀", "opts": [["📺", "Televisor"], ["🚿", "Manguera"], ["🛢️💧", "Tanque de agua"], ["💧", "Agua"]], "a": 0, "exp": "El televisor no responde al problema de falta de agua de las plantas."}, {"q": "¿Cuál es una tecnología que puedes usar con tus manos?", "icon": "✋", "opts": [["📱", "Celular"], ["☁️", "Nube"], ["🌳", "Árbol"], ["🪨", "Roca"]], "a": 0, "exp": "El celular es un objeto tecnológico que una persona puede usar directamente."}, {"q": "¿Qué necesita una planta seca para mejorar?", "icon": "🥀➡️🌱", "opts": [["💧", "Agua"], ["🎮", "Videojuego"], ["🎒", "Mochila"], ["🧸", "Juguete"]], "a": 0, "exp": "Una planta seca necesita agua. La tecnología puede ayudarnos a llevarla y administrarla."}];let qs=[],i=0,score=0,ok=0,name="",lock=false;
const $=x=>document.getElementById(x);function mix(a){return [...a].sort(()=>Math.random()-.5)}
function start(){name=$("name").value.trim()||name||"Estudiante";qs=mix(B).slice(0,5);i=0;score=0;ok=0;$("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");render()}
function render(){lock=false;let x=qs[i];$("who").textContent="👤 "+name;$("score").textContent=score;$("bar").style.width=(i/5*100)+"%";$("qicon").textContent=x.icon;$("q").textContent=x.q;$("opts").innerHTML="";$("fb").className="feedback hidden";$("next").classList.add("hidden");
x.opts.forEach((o,n)=>{let b=document.createElement("button");b.className="option";b.innerHTML='<span class="pic">'+o[0]+'</span>'+String.fromCharCode(65+n)+'. '+o[1];b.onclick=()=>ans(n,b);$("opts").appendChild(b)})}
function ans(n,b){if(lock)return;lock=true;let x=qs[i],bs=[...document.querySelectorAll(".option")];bs.forEach(z=>z.disabled=true);bs[x.a].classList.add("good");
if(n===x.a){score+=100;ok++;$("fb").className="feedback good";$("fb").innerHTML="<b>🎉 ¡MUY BIEN!</b><br>"+x.exp}else{b.classList.add("bad");$("fb").className="feedback bad";$("fb").innerHTML="<b>💡 MIRA LA RESPUESTA VERDE.</b><br>"+x.exp}$("score").textContent=score;$("next").classList.remove("hidden")}
function next(){i++;if(i<5)render();else finish()}
function finish(){$("game").classList.add("hidden");$("end").classList.remove("hidden");$("final").textContent=score;if(ok>=4){$("endIcon").textContent="🏆";$("endTitle").textContent="¡Excelente, "+name+"!";$("endText").textContent="Lo hiciste muy bien. Puedes jugar otra vez para seguir practicando."}else{$("endIcon").textContent="🌟";$("endTitle").textContent="¡Buen trabajo, "+name+"!";$("endText").textContent="Cada intento te ayuda a aprender. Juega otra vez y mira con atención las imágenes."}}
</script></body></html>
